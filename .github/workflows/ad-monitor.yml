name: Daangn spend monitor
on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'demo=샘플 확인 / preview=실데이터 조회만 / live=조회 후 Slack 발송'
        type: choice
        options: [demo, preview, live]
        default: demo
permissions:
  contents: read
concurrency:
  group: daangn-spend-monitor
  cancel-in-progress: false
jobs:
  monitor:
    # Enable only after implementing and testing the real data adapter.
    if: github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test calculations and failure handling
        run: python -m unittest discover -s tests -v
      - name: Run monitor
        env:
          RUN_MODE: ${{ inputs.mode || 'live' }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # Add confirmed Daangn credential env vars here after adapter implementation.
        shell: bash
        run: |
          case "$RUN_MODE" in
            demo) python monitor.py --demo ;;
            preview) python monitor.py ;;
            live) python monitor.py --send ;;
            *) exit 2 ;;
          esac
